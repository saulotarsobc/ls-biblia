name: Release

# Publica uma nova versão sempre que algo chega na branch `release`.
# A versão publicada é sempre a que está em package.json — a branch é só
# o gatilho, então o fluxo normal é: `npm version <patch|minor|major>` na
# main, merge/push para `release`.
on:
  push:
    branches:
      - release

# O GITHUB_TOKEN padrão é read-only. Precisamos de escrita para criar a
# tag, a release e subir os assets. Nenhum PAT é necessário.
permissions:
  contents: write

# Dois pushes seguidos na `release` publicariam a mesma tag ao mesmo tempo.
# A fila serializa as execuções; `cancel-in-progress: false` é proposital:
# cancelar no meio do upload deixaria a release com assets pela metade.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # O único target configurado em package.json é `win: nsis`, então o
    # build precisa rodar no Windows.
    runs-on: windows-latest

    env:
      # `gh` lê GITHUB_TOKEN; o electron-builder lê GH_TOKEN. É o mesmo
      # token efêmero do Actions nos dois casos.
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      # fetch-depth: 0 traz o histórico completo e as tags — sem isso não
      # dá para descobrir a tag anterior nem montar o changelog.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A versão do Node vem do .nvmrc, para o CI usar exatamente a mesma
      # do desenvolvimento. `cache: npm` reaproveita o cache do npm entre
      # execuções e encurta bastante o `npm ci`.
      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` (e não `install`) para respeitar o package-lock.json.
      - name: Instala dependências
        run: npm ci

      - name: Lê a versão do package.json
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Publicando a versão $VERSION (tag v$VERSION)"

      # Idempotente: cria a tag se não existir, e a move se já existir
      # apontando para outro commit (caso de re-push na `release` com a
      # mesma versão). Se já aponta para este commit, não faz nada.
      - name: Cria ou atualiza a tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA" ]; then
              echo "Tag $TAG já existe e aponta para este commit — nada a fazer."
            else
              echo "::warning::A tag $TAG existia em outro commit e foi movida para $GITHUB_SHA."
              git tag -f -a "$TAG" -m "$TAG"
              git push --force origin "refs/tags/$TAG"
            fi
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      # Monta o changelog a partir dos commits desde a tag anterior,
      # agrupado pelos tipos do padrão do projeto (.github/commit.md).
      # Commits fora do padrão vão para "Outras mudanças" — nada some.
      - name: Gera o changelog dos commits
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          # Tag anterior = maior versão que não seja a que está sendo publicada.
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
            echo "Commits de $PREV_TAG até $TAG"
          else
            RANGE="HEAD"
            echo "Primeira release: usando todo o histórico"
          fi

          KNOWN='feat|fix|perf|refactor|docs|test|chore|build|ci|style|revert'

          # $1 = regex dos tipos da seção, $2 = título.
          # O sed corta o prefixo "tipo(escopo)!:" e mantém só a descrição.
          section() {
            local types="$1" title="$2" lines
            lines="$(git log --no-merges --reverse --format='%s (%h)' "$RANGE" \
              | grep -E "^($types)(\([^)]*\))?!?: " \
              | sed -E "s/^($types)(\([^)]*\))?!?: */- /" || true)"
            if [ -z "$lines" ]; then return 0; fi
            printf '### %s\n\n%s\n\n' "$title" "$lines"
          }

          {
            section 'feat'                            '✨ Novidades'
            section 'fix'                             '🐛 Correções'
            section 'perf|refactor'                   '♻️ Melhorias internas'
            section 'docs'                            '📚 Documentação'
            section 'test|chore|build|ci|style|revert' '🧹 Manutenção'

            # Além dos tipos já listados, descarta o commit que o
            # `npm version` cria (a mensagem é só o número da versão).
            OTHERS="$(git log --no-merges --reverse --format='%s (%h)' "$RANGE" \
              | grep -Ev "^($KNOWN)(\([^)]*\))?!?: " \
              | grep -Ev '^v?[0-9]+\.[0-9]+\.[0-9]+ \([0-9a-f]+\)$' \
              | sed -E 's/^/- /' || true)"
            if [ -n "$OTHERS" ]; then
              printf '### 📦 Outras mudanças\n\n%s\n\n' "$OTHERS"
            fi
          } > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "_Sem commits novos desde a versão anterior._" > release-notes.md
          fi

          cat release-notes.md

      # Idempotente: só cria a release se ela ainda não existir, para não
      # sobrescrever notas que tenham sido editadas à mão.
      #
      # --generate-notes acrescenta as notas automáticas do GitHub (PRs
      # e o link "Full Changelog") logo abaixo do nosso changelog: a API
      # pré-anexa o `body` informado ao texto gerado.
      #
      # --verify-tag garante que a release seja criada na tag que acabamos
      # de publicar, e não num commit qualquer da branch padrão.
      - name: Cria a GitHub Release
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe — mantendo o corpo atual."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --generate-notes \
              --verify-tag
          fi

      # `npm run release` = build + `electron-builder --publish always`.
      # O electron-builder acha a release pela tag e sobe latest.yml, o
      # instalador NSIS e o .blockmap nela.
      #
      # EP_GH_IGNORE_TIME é essencial: sem essa flag o electron-builder se
      # recusa a subir assets numa release publicada há mais de 2 horas e
      # sai com sucesso, apenas logando um aviso — ou seja, uma re-execução
      # do workflow passaria "verde" sem publicar nada.
      - name: Build e publicação dos assets
        env:
          EP_GH_IGNORE_TIME: 'true'
        run: npm run release
